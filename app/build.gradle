plugins {
    id 'com.android.application'
}

android {
    namespace 'com.mkaand.hiremcostarter'
    compileSdk 34

    defaultConfig {
        applicationId "com.mkaand.hiremcostarter"
        minSdk 27
        targetSdk 33
        versionCode 4
        versionName "2.2"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            // Debug build uses AGP's auto-generated debug keystore.
            // No signing configuration needed for sideloading via adb.
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
