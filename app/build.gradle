plugins {
    id 'com.android.application'
}

def releaseSigningValues = [
    keystorePath: providers.environmentVariable('HIREMCO_RELEASE_KEYSTORE_PATH')
        .orElse(providers.gradleProperty('hiremcoReleaseKeystorePath')).orNull,
    storePassword: providers.environmentVariable('HIREMCO_RELEASE_STORE_PASSWORD')
        .orElse(providers.gradleProperty('hiremcoReleaseStorePassword')).orNull,
    keyAlias: providers.environmentVariable('HIREMCO_RELEASE_KEY_ALIAS')
        .orElse(providers.gradleProperty('hiremcoReleaseKeyAlias')).orNull,
    keyPassword: providers.environmentVariable('HIREMCO_RELEASE_KEY_PASSWORD')
        .orElse(providers.gradleProperty('hiremcoReleaseKeyPassword')).orNull
]
def suppliedReleaseSigningValues = releaseSigningValues.findAll { it.value }
if (!suppliedReleaseSigningValues.isEmpty() && suppliedReleaseSigningValues.size() != releaseSigningValues.size()) {
    def missingValues = releaseSigningValues.findAll { !it.value }.keySet().join(', ')
    throw new GradleException("Incomplete Hiremco release signing configuration; missing: ${missingValues}")
}
def releaseSigningConfigured = suppliedReleaseSigningValues.size() == releaseSigningValues.size()

android {
    namespace 'com.mkaand.hiremcostarter'
    compileSdk 34

    defaultConfig {
        applicationId "com.mkaand.hiremcostarter"
        minSdk 27
        targetSdk 33
        versionCode 5
        versionName "3.0"
    }

    signingConfigs {
        if (releaseSigningConfigured) {
            release {
                storeFile file(releaseSigningValues.keystorePath)
                storePassword releaseSigningValues.storePassword
                keyAlias releaseSigningValues.keyAlias
                keyPassword releaseSigningValues.keyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (releaseSigningConfigured) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            // Debug build uses AGP's auto-generated debug keystore.
            // No signing configuration needed for sideloading via adb.
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

gradle.taskGraph.whenReady { taskGraph ->
    def releaseTaskRequested = taskGraph.allTasks.any { task ->
        task.project == project && task.name.toLowerCase(Locale.ROOT).contains('release')
    }
    if (releaseTaskRequested && !releaseSigningConfigured) {
        throw new GradleException(
            'Release signing is required. Supply the HIREMCO_RELEASE_KEYSTORE_PATH, ' +
            'HIREMCO_RELEASE_STORE_PASSWORD, HIREMCO_RELEASE_KEY_ALIAS, and ' +
            'HIREMCO_RELEASE_KEY_PASSWORD environment variables (or matching Gradle properties).'
        )
    }
}
