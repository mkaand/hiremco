name: Build Hiremco Starter APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # No committed Gradle wrapper jar in this project, so we call the
      # `gradle` binary that setup-gradle just put on PATH directly,
      # instead of ./gradlew.
      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Hiremco-Starter-debug-apk
          path: app/build/outputs/apk/debug/*.apk
