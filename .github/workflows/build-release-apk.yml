name: Build signed Hiremco Starter APK

on:
  workflow_dispatch: {}
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: '8.7'

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - name: Install Android SDK platform and build tools
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Decode release keystore
        env:
          HIREMCO_RELEASE_KEYSTORE_B64: ${{ secrets.HIREMCO_RELEASE_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          test -n "$HIREMCO_RELEASE_KEYSTORE_B64"
          keystore_path="$RUNNER_TEMP/hiremco-release.jks"
          printf '%s' "$HIREMCO_RELEASE_KEYSTORE_B64" | base64 --decode > "$keystore_path"
          chmod 600 "$keystore_path"
          echo "HIREMCO_RELEASE_KEYSTORE_PATH=$keystore_path" >> "$GITHUB_ENV"

      - name: Build signed release APK
        env:
          HIREMCO_RELEASE_STORE_PASSWORD: ${{ secrets.HIREMCO_RELEASE_STORE_PASSWORD }}
          HIREMCO_RELEASE_KEY_ALIAS: ${{ secrets.HIREMCO_RELEASE_KEY_ALIAS }}
          HIREMCO_RELEASE_KEY_PASSWORD: ${{ secrets.HIREMCO_RELEASE_KEY_PASSWORD }}
        run: gradle :app:assembleRelease --stacktrace

      - name: Verify, name, and checksum APK
        run: |
          set -euo pipefail
          mapfile -t apks < <(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print)
          if [ "${#apks[@]}" -ne 1 ]; then
            echo "Expected exactly one release APK, found ${#apks[@]}" >&2
            exit 1
          fi
          apksigner="$ANDROID_HOME/build-tools/34.0.0/apksigner"
          "$apksigner" verify --verbose --print-certs "${apks[0]}"
          mkdir -p dist
          cp "${apks[0]}" dist/Hiremco-Starter-v3.0.apk
          cd dist
          sha256sum Hiremco-Starter-v3.0.apk > Hiremco-Starter-v3.0.apk.sha256

      - name: Upload signed release artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Hiremco-Starter-v3.0-release
          path: |
            dist/Hiremco-Starter-v3.0.apk
            dist/Hiremco-Starter-v3.0.apk.sha256
          if-no-files-found: error
